name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate

      - name: Typecheck API
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: Typecheck Dashboard
        run: npx tsc --noEmit --project apps/dashboard/tsconfig.json

      - name: Run API Unit Tests
        run: npm --workspace @skynode/api test -- --ci --maxWorkers=2

      - name: Build API
        run: npm --workspace @skynode/api run build

      - name: Build Dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm --workspace @skynode/dashboard run build
