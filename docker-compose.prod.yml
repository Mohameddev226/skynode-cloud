# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    ports: []
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  redis:
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  minio:
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  nginx:
    image: nginx:alpine
    container_name: skynode-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - skynode-internal
      - skynode-public

networks:
  skynode-public:
    driver: bridge
