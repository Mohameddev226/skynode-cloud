# Netlify configuration for SkyNode Cloud Dashboard
[build]
  command = "npm --workspace @skynode/dashboard run build"
  publish = "apps/dashboard/.next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_USE_NETLIFY_EDGE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy API requests to the Render backend
[[redirects]]
  from = "/api/*"
  to = "https://skynode-cloud.onrender.com/api/:splat"
  status = 200
  force = true
